name: CD — Vertra Cloud Production

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      initial_wait_seconds:
        description: 'Seconds to wait before polling production readiness'
        required: false
        default: '10'
        type: string
      create_release:
        description: 'Create SemVer Git Tag & GitHub Release'
        required: false
        default: false
        type: boolean

concurrency:
  group: cd-backend-production
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  quality-gate:
    name: Pre-Deploy Test Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run test suite
        run: |
          chmod +x mvnw
          ./mvnw -B test

  deploy-and-smoke-test:
    name: Deploy, Smoke Test & SemVer Release
    needs: quality-gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PROD_API_URL: ${{ vars.PROD_API_URL || 'https://api.benchos.app.br' }}

    steps:
      - name: Checkout repository (full history for SemVer)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Trigger Vertra Cloud deploy webhook (optional)
        env:
          WEBHOOK_URL: ${{ secrets.VERTRA_DEPLOY_WEBHOOK_URL }}
        run: |
          if [ -n "$WEBHOOK_URL" ]; then
            echo "Triggering Vertra Cloud deploy webhook..."
            curl --fail-with-body --silent --show-error -X POST "$WEBHOOK_URL"
            echo ""
            echo "Webhook accepted."
          else
            echo "No VERTRA_DEPLOY_WEBHOOK_URL configured — Vertra Cloud GitHub auto-deploy on master handles rollout."
          fi

      - name: Wait for rollout & verify production readiness
        env:
          INITIAL_WAIT: ${{ inputs.initial_wait_seconds || '30' }}
        run: |
          echo "Waiting ${INITIAL_WAIT}s for Vertra Cloud rolling restart..."
          sleep "${INITIAL_WAIT}"

          HEALTH_URL="${PROD_API_URL%/}/actuator/health/readiness"
          echo "Polling ${HEALTH_URL}..."

          READY=false
          for attempt in $(seq 1 18); do
            RESPONSE=$(curl -sS --max-time 10 -w "\n%{http_code}" "$HEALTH_URL" || true)
            HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
            BODY=$(echo "$RESPONSE" | sed '$d')
            echo "Attempt ${attempt}/18 -> HTTP ${HTTP_CODE} ${BODY}"

            if [ "$HTTP_CODE" = "200" ] && echo "$BODY" | grep -q '"status":"UP"'; then
              READY=true
              break
            fi
            sleep 10
          done

          if [ "$READY" != "true" ]; then
            echo "::error::Production readiness probe failed at ${HEALTH_URL}"
            exit 1
          fi

      - name: Verify Swagger UI remains disabled in production
        run: |
          SWAGGER_URL="${PROD_API_URL%/}/swagger-ui.html"
          SWAGGER_CODE=$(curl -sS -o /dev/null --max-time 10 -w "%{http_code}" "$SWAGGER_URL")
          echo "GET ${SWAGGER_URL} -> HTTP ${SWAGGER_CODE}"
          if [ "$SWAGGER_CODE" = "200" ]; then
            echo "::error::Swagger UI should be disabled in production!"
            exit 1
          fi

      - name: Tag SemVer release & publish GitHub Release
        id: release
        if: ${{ github.event_name == 'push' || inputs.create_release == true }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 << 'EOF'
          import os, re, subprocess

          def run(cmd):
              return subprocess.check_output(cmd, text=True).strip()

          tags = [t.strip() for t in run(["git", "tag", "--list", "v*.*.*", "--sort=-v:refname"]).splitlines() if t.strip()]
          last_tag = tags[0] if tags else ""

          base = last_tag.lstrip("v") if last_tag else "1.0.0"
          maj, min_, pat = [int(x) for x in base.split(".")[:3]]

          git_range = f"{last_tag}..HEAD" if last_tag else "HEAD~10..HEAD"
          try:
              raw = run(["git", "log", git_range, "--no-merges", "--format=%s%n%b%n---COMMIT---"])
          except subprocess.CalledProcessError:
              raw = run(["git", "log", "--no-merges", "--format=%s%n%b%n---COMMIT---"])

          commits = [c.strip() for c in raw.split("---COMMIT---") if c.strip()]
          bump = "patch"
          for msg in commits:
              subject = msg.splitlines()[0]
              if re.search(r"BREAKING CHANGE:", msg, re.I) or re.match(r"^[a-z]+(\([^)]+\))?!:", subject):
                  bump = "major"
                  break
              if re.match(r"^(feat|feature)(\([^)]+\))?:", subject, re.I):
                  bump = "minor"

          if bump == "major":
              next_ver = f"{maj + 1}.0.0"
          elif bump == "minor":
              next_ver = f"{maj}.{min_ + 1}.0"
          else:
              next_ver = f"{maj}.{min_}.{pat + 1}"

          tag = f"v{next_ver}"
          notes = "\n".join(f"- {c.splitlines()[0]}" for c in commits if c.splitlines()) or "- Automated release"
          with open("/tmp/backend-release-notes.md", "w", encoding="utf-8") as f:
              f.write(notes + "\n")

          subprocess.check_call(["git", "config", "user.name", "github-actions[bot]"])
          subprocess.check_call(["git", "config", "user.email", "41898282+github-actions[bot]@users.noreply.github.com"])
          subprocess.check_call(["git", "tag", "-a", tag, "-m", f"Release {tag}"])
          subprocess.check_call(["git", "push", "origin", tag])
          subprocess.check_call(["gh", "release", "create", tag, "--title", f"BenchOS API {tag}", "--notes-file", "/tmp/backend-release-notes.md"])

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"tag={tag}\n")
              out.write(f"bump={bump}\n")
          EOF

      - name: Publish deployment summary
        if: always()
        run: |
          {
            echo "## BenchOS Backend — Production CD"
            echo ""
            echo "- **Release:** \`${{ steps.release.outputs.tag || 'manual check' }}\` (${{ steps.release.outputs.bump || 'no tag' }})"
            echo "- **Commit:** \`${GITHUB_SHA::7}\`"
            echo "- **Endpoint:** ${PROD_API_URL}"
            echo "- **Health Probe:** \`${PROD_API_URL%/}/actuator/health/readiness\`"
            echo "- **Swagger Disabled Check:** Verified"
          } >> "$GITHUB_STEP_SUMMARY"
