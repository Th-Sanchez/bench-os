services:
  postgres:
    image: postgres:latest
    container_name: bench-os-postgres
    environment:
      POSTGRES_DB: bench-os-db
      POSTGRES_USER: ${DATASOURCE_USER:-bench_os}
      POSTGRES_PASSWORD: ${DATASOURCE_PASSWORD:-bench_os}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data: