services:
  postgres:
    image: postgres:17-alpine
    container_name: bench-os-postgres
    environment:
      POSTGRES_DB: ${DATASOURCE_DB:-bench-os-db}
      POSTGRES_USER: ${DATASOURCE_USER:-bench_os}
      POSTGRES_PASSWORD: ${DATASOURCE_PASSWORD:-bench_os}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  rustfs:
    image: rustfs/rustfs:latest
    container_name: bench-os-storage
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-benchos_storage}
      RUSTFS_SECRET_KEY: ${STORAGE_SECRET_KEY:-benchos_storage_secret}
      RUSTFS_CORS_ALLOWED_ORIGINS: "*"
      RUSTFS_OBS_LOGGER_LEVEL: "info"
    volumes:
      - storage_data:/data
    command: ["/data"]

volumes:
  postgres_data:
  storage_data:
