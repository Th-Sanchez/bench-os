server:
  port: ${PORT:8080}
  shutdown: graceful
  tomcat:
    remoteip:
      internal-proxies: ${REMOTEIP_INTERNAL_PROXIES:10\.\d{1,3}\.\d{1,3}\.\d{1,3}|192\.168\.\d{1,3}\.\d{1,3}|169\.254\.\d{1,3}\.\d{1,3}|127\.\d{1,3}\.\d{1,3}\.\d{1,3}|100\.6[4-9]\.\d{1,3}\.\d{1,3}|100\.[7-9]\d\.\d{1,3}\.\d{1,3}|100\.1[01]\d\.\d{1,3}\.\d{1,3}|100\.12[0-7]\.\d{1,3}\.\d{1,3}|172\.1[6-9]\.\d{1,3}\.\d{1,3}|172\.2[0-9]\.\d{1,3}\.\d{1,3}|172\.3[0-1]\.\d{1,3}\.\d{1,3}|0:0:0:0:0:0:0:1|::1}
  compression:
    enabled: true
    min-response-size: 1024
  request:
    header:
      forwarded:
        strategy: ${FORWARD_HEADERS_STRATEGY:web-server}

spring:
  application:
    name: BenchOS
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: ${DATASOURCE_URL:jdbc:postgresql://localhost:5432/bench-os-db}
    username: ${DATASOURCE_USER:bench_os}
    password: ${DATASOURCE_PASSWORD:bench_os}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include:
            - readinessState
            - db
      show-details: never

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
    operations-sorter: method
    tags-sorter: alpha

benchos:
  security:
    jwt:
      secret: ${JWT_SECRET:benchos-local-dev-secret-key-change-in-production-32bytes!}
      expiration: ${JWT_EXPIRATION:24h}
      issuer: ${JWT_ISSUER:https://api.benchos.com}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8081}
    transport:
      require-https: ${REQUIRE_HTTPS:false}
    rate-limit:
      enabled: ${RATE_LIMIT_ENABLED:true}
      max-entries: ${RATE_LIMIT_MAX_ENTRIES:10000}
      trust-forwarded-headers: ${RATE_LIMIT_TRUST_FORWARDED_HEADERS:false}
      login:
        ip-max-requests: ${RATE_LIMIT_LOGIN_IP_MAX:20}
        ip-window: ${RATE_LIMIT_LOGIN_IP_WINDOW:5m}
        account-max-requests: ${RATE_LIMIT_LOGIN_ACCOUNT_MAX:10}
        account-window: ${RATE_LIMIT_LOGIN_ACCOUNT_WINDOW:5m}
      register:
        ip-max-requests: ${RATE_LIMIT_REGISTER_IP_MAX:5}
        ip-window: ${RATE_LIMIT_REGISTER_IP_WINDOW:15m}
      forgot-password:
        ip-max-requests: ${RATE_LIMIT_FORGOT_IP_MAX:10}
        ip-window: ${RATE_LIMIT_FORGOT_IP_WINDOW:15m}
        account-max-requests: ${RATE_LIMIT_FORGOT_ACCOUNT_MAX:5}
        account-window: ${RATE_LIMIT_FORGOT_ACCOUNT_WINDOW:15m}
      reset-password:
        ip-max-requests: ${RATE_LIMIT_RESET_IP_MAX:15}
        ip-window: ${RATE_LIMIT_RESET_IP_WINDOW:15m}
        account-max-requests: ${RATE_LIMIT_RESET_ACCOUNT_MAX:10}
        account-window: ${RATE_LIMIT_RESET_ACCOUNT_WINDOW:15m}
      public-read:
        ip-max-requests: ${RATE_LIMIT_PUBLIC_READ_IP_MAX:60}
        ip-window: ${RATE_LIMIT_PUBLIC_READ_IP_WINDOW:1m}
      public-write:
        ip-max-requests: ${RATE_LIMIT_PUBLIC_WRITE_IP_MAX:15}
        ip-window: ${RATE_LIMIT_PUBLIC_WRITE_IP_WINDOW:5m}
  public-tracking:
    base-url: ${PUBLIC_TRACKING_BASE_URL:http://localhost:8080/track}
    require-https: ${PUBLIC_TRACKING_REQUIRE_HTTPS:false}
  storage:
    endpoint: ${STORAGE_ENDPOINT:http://localhost:9000}
    region: ${STORAGE_REGION:us-east-1}
    bucket: ${STORAGE_BUCKET:benchos-media}
    access-key: ${STORAGE_ACCESS_KEY:benchos_storage}
    secret-key: ${STORAGE_SECRET_KEY:benchos_storage_secret}
    upload-url-ttl: ${STORAGE_UPLOAD_URL_TTL:10m}
    download-url-ttl: ${STORAGE_DOWNLOAD_URL_TTL:1h}
    path-style-access: ${STORAGE_PATH_STYLE_ACCESS:true}
    auto-create-bucket: ${STORAGE_AUTO_CREATE_BUCKET:true}
  mail:
    provider: ${MAIL_PROVIDER:log}
    from: ${MAIL_FROM:BenchOS <onboarding@resend.dev>}
    resend-api-key: ${RESEND_API_KEY:}
    resend-base-url: ${RESEND_BASE_URL:https://api.resend.com}
    reset-code-ttl: ${MAIL_RESET_CODE_TTL:15m}
    resend-cooldown: ${MAIL_RESEND_COOLDOWN:60s}
  push:
    provider: ${PUSH_PROVIDER:log}
    expo-endpoint-url: ${EXPO_PUSH_ENDPOINT_URL:https://exp.host/--/api/v2/push/send}
    expo-access-token: ${EXPO_PUSH_ACCESS_TOKEN:}
    daily-alerts-enabled: ${PUSH_DAILY_ALERTS_ENABLED:false}
    daily-alerts-cron: ${PUSH_DAILY_ALERTS_CRON:0 30 8 * * *}
    daily-alerts-zone: ${PUSH_DAILY_ALERTS_ZONE:America/Sao_Paulo}
