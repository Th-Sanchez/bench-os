server:
  port: ${PORT:8080}
  shutdown: graceful
  compression:
    enabled: true
    min-response-size: 1024

spring:
  application:
    name: BenchOS
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: ${DATASOURCE_URL:jdbc:postgresql://localhost:5432/bench-os-db}
    username: ${DATASOURCE_USER:bench_os}
    password: ${DATASOURCE_PASSWORD:bench_os}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
    operations-sorter: method
    tags-sorter: alpha

benchos:
  security:
    jwt:
      secret: ${JWT_SECRET:benchos-local-dev-secret-key-change-in-production-32bytes!}
      expiration: ${JWT_EXPIRATION:24h}
      issuer: ${JWT_ISSUER:https://api.benchos.com}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8081}
  public-tracking:
    base-url: ${PUBLIC_TRACKING_BASE_URL:https://app.benchos.com/track}
  storage:
    endpoint: ${STORAGE_ENDPOINT:https://r2.local.benchos.test}
    region: ${STORAGE_REGION:auto}
    bucket: ${STORAGE_BUCKET:benchos-media}
    access-key: ${STORAGE_ACCESS_KEY:benchos-local-dev-access-key}
    secret-key: ${STORAGE_SECRET_KEY:benchos-local-dev-secret-key}
    upload-url-ttl: ${STORAGE_UPLOAD_URL_TTL:10m}
    download-url-ttl: ${STORAGE_DOWNLOAD_URL_TTL:1h}
    path-style-access: ${STORAGE_PATH_STYLE_ACCESS:true}
