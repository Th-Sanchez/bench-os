spring:
  datasource:
    url: ${DATASOURCE_URL}
    username: ${DATASOURCE_USER}
    password: ${DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:8}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}

benchos:
  security:
    jwt:
      secret: ${JWT_SECRET}
      expiration: ${JWT_EXPIRATION:24h}
      issuer: ${JWT_ISSUER:https://api.benchos.com}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS}
    transport:
      require-https: ${REQUIRE_HTTPS:true}
    rate-limit:
      enabled: ${RATE_LIMIT_ENABLED:true}
      max-entries: ${RATE_LIMIT_MAX_ENTRIES:10000}
      trust-forwarded-headers: ${RATE_LIMIT_TRUST_FORWARDED_HEADERS:false}
  public-tracking:
    base-url: ${PUBLIC_TRACKING_BASE_URL}
    require-https: ${PUBLIC_TRACKING_REQUIRE_HTTPS:true}
  storage:
    endpoint: ${STORAGE_ENDPOINT}
    region: ${STORAGE_REGION:auto}
    bucket: ${STORAGE_BUCKET}
    access-key: ${STORAGE_ACCESS_KEY}
    secret-key: ${STORAGE_SECRET_KEY}
    upload-url-ttl: ${STORAGE_UPLOAD_URL_TTL:10m}
    download-url-ttl: ${STORAGE_DOWNLOAD_URL_TTL:1h}
    path-style-access: ${STORAGE_PATH_STYLE_ACCESS:true}
    auto-create-bucket: false
  mail:
    provider: ${MAIL_PROVIDER:resend}
    from: ${MAIL_FROM:BenchOS <onboarding@resend.dev>}
    resend-api-key: ${RESEND_API_KEY:}
    resend-base-url: ${RESEND_BASE_URL:https://api.resend.com}
    reset-code-ttl: ${MAIL_RESET_CODE_TTL:15m}
    resend-cooldown: ${MAIL_RESEND_COOLDOWN:60s}
  push:
    provider: ${PUSH_PROVIDER:expo}
    expo-endpoint-url: ${EXPO_PUSH_ENDPOINT_URL:https://exp.host/--/api/v2/push/send}
    expo-access-token: ${EXPO_PUSH_ACCESS_TOKEN:}
    daily-alerts-enabled: ${PUSH_DAILY_ALERTS_ENABLED:true}
    daily-alerts-cron: ${PUSH_DAILY_ALERTS_CRON:0 30 8 * * *}
    daily-alerts-zone: ${PUSH_DAILY_ALERTS_ZONE:America/Sao_Paulo}

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %5p [req=%X{requestId:-none} tenant=%X{tenantId:-public}] %logger{36} : %m%n%wEx"
  level:
    root: INFO
    com.benchos.api: INFO
