spring:
  datasource:
    url: ${DATASOURCE_URL}
    username: ${DATASOURCE_USER}
    password: ${DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:8}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}

benchos:
  security:
    jwt:
      secret: ${JWT_SECRET}
      expiration: ${JWT_EXPIRATION:24h}
      issuer: ${JWT_ISSUER:https://api.benchos.com}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS}
  public-tracking:
    base-url: ${PUBLIC_TRACKING_BASE_URL}
  storage:
    endpoint: ${STORAGE_ENDPOINT}
    region: ${STORAGE_REGION:auto}
    bucket: ${STORAGE_BUCKET}
    access-key: ${STORAGE_ACCESS_KEY}
    secret-key: ${STORAGE_SECRET_KEY}
    upload-url-ttl: ${STORAGE_UPLOAD_URL_TTL:10m}
    download-url-ttl: ${STORAGE_DOWNLOAD_URL_TTL:1h}
    path-style-access: ${STORAGE_PATH_STYLE_ACCESS:true}

logging:
  level:
    root: INFO
    com.benchos.api: INFO
