<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Acompanhamento de Reparo · BenchOS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-canvas: #F8FAFC;
      --bg-surface: #FFFFFF;
      --bg-subtle: #F1F5F9;
      --border-subtle: #E2E8F0;
      --text-primary: #0F172A;
      --text-secondary: #475569;
      --text-muted: #64748B;
      --brand: #2563EB;
      --brand-dark: #1D4ED8;
      --brand-soft: #EFF6FF;
      --brand-border: #BFDBFE;
      --success: #10B981;
      --success-dark: #065F46;
      --success-soft: #ECFDF5;
      --success-border: #A7F3D0;
      --warning: #D97706;
      --warning-dark: #92400E;
      --warning-soft: #FFFBEB;
      --warning-border: #FDE68A;
      --danger: #DC2626;
      --danger-dark: #991B1B;
      --danger-soft: #FEF2F2;
      --danger-border: #FECACA;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg-canvas);
      color: var(--text-primary);
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-subtle);
    }
    .topbar-inner {
      max-width: 520px;
      margin: 0 auto;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }
    .brand-icon {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: var(--brand);
      color: #fff;
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }
    .shop-name {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 700;
      font-size: 17px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .shop-sub {
      font-size: 12px;
      color: var(--text-secondary);
    }
    .os-pill {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      font-size: 12px;
      background: var(--brand-soft);
      color: #1E40AF;
      border: 1px solid var(--brand-border);
      padding: 5px 10px;
      border-radius: 9999px;
      white-space: nowrap;
    }

    .container {
      max-width: 520px;
      margin: 0 auto;
      padding: 16px 16px 36px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .banner {
      background: var(--brand-soft);
      border: 1px solid var(--brand-border);
      border-radius: 12px;
      padding: 14px;
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }
    .banner-icon {
      width: 34px;
      height: 34px;
      border-radius: 9999px;
      background: #fff;
      color: var(--brand);
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }
    .banner-title {
      font-weight: 600;
      font-size: 14px;
      margin-bottom: 3px;
    }
    .banner-text {
      font-size: 13px;
      line-height: 1.45;
      color: var(--text-secondary);
    }

    .card {
      background: var(--bg-surface);
      border: 1px solid var(--border-subtle);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .row-between {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .tag-pill {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      font-size: 12px;
      background: var(--bg-subtle);
      color: var(--text-secondary);
      padding: 3px 8px;
      border-radius: 6px;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 9999px;
      border: 1px solid transparent;
    }
    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
    }
    .st-neutral { background: var(--bg-subtle); color: #334155; border-color: var(--border-subtle); }
    .st-neutral .status-dot { background: #475569; }
    .st-info { background: var(--brand-soft); color: #1E40AF; border-color: var(--brand-border); }
    .st-info .status-dot { background: var(--brand); }
    .st-warning { background: var(--warning-soft); color: var(--warning-dark); border-color: var(--warning-border); }
    .st-warning .status-dot { background: var(--warning); }
    .st-success { background: var(--success-soft); color: var(--success-dark); border-color: var(--success-border); }
    .st-success .status-dot { background: var(--success); }
    .st-danger { background: var(--danger-soft); color: var(--danger-dark); border-color: var(--danger-border); }
    .st-danger .status-dot { background: var(--danger); }

    .appliance-title {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 700;
      font-size: 18px;
      letter-spacing: -0.2px;
    }
    .entry-sub {
      font-size: 12px;
      color: var(--text-secondary);
      margin-top: 2px;
    }

    .stepper {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .step-labels {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 4px;
      text-align: center;
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      color: var(--text-muted);
    }
    .step-labels .reached { color: var(--brand); font-weight: 700; }
    .step-labels .warn { color: var(--warning-dark); font-weight: 700; }
    .step-labels .danger { color: var(--danger-dark); font-weight: 700; }

    .step-bars {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
    }
    .step-bar {
      height: 8px;
      border-radius: 9999px;
      background: var(--bg-subtle);
    }
    .step-bar.reached { background: var(--brand); }
    .step-bar.warn { background: var(--warning); }
    .step-bar.danger { background: var(--danger); }

    .helper-line {
      font-size: 12px;
      color: var(--text-secondary);
      line-height: 1.45;
    }

    .diag-box {
      background: var(--bg-canvas);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 12px;
    }
    .diag-box.warn {
      background: var(--warning-soft);
      border-color: var(--warning-border);
    }
    .overline {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      font-size: 10px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 4px;
    }
    .diag-box.warn .overline { color: var(--warning-dark); }
    .diag-body {
      font-size: 14px;
      line-height: 1.5;
      color: var(--text-primary);
      white-space: pre-line;
    }

    .photos-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-top: 6px;
    }
    .photo-tile {
      position: relative;
      height: 120px;
      border-radius: 8px;
      overflow: hidden;
      background: var(--bg-subtle);
      cursor: pointer;
      border: 1px solid var(--border-subtle);
    }
    .photo-tile img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .photo-stage {
      position: absolute;
      left: 6px;
      bottom: 6px;
      background: rgba(15, 23, 42, 0.82);
      color: #fff;
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      padding: 2px 7px;
      border-radius: 4px;
    }

    .price-footer {
      border-top: 1px solid var(--bg-subtle);
      padding-top: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }
    .price-label { font-size: 12px; color: var(--text-secondary); }
    .price-value {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      font-size: 20px;
      color: var(--text-primary);
    }
    .warranty-pill {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      font-size: 11px;
      background: var(--brand-soft);
      color: #1E40AF;
      border: 1px solid var(--brand-border);
      padding: 6px 10px;
      border-radius: 8px;
    }

    /* Customer Quote Decision Box */
    .decision-box {
      background: var(--warning-soft);
      border: 1px solid var(--warning-border);
      border-radius: 10px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .decision-title {
      font-weight: 700;
      font-size: 14px;
      color: var(--warning-dark);
    }
    .decision-sub {
      font-size: 12.5px;
      color: var(--text-secondary);
      line-height: 1.45;
    }
    .decision-actions {
      display: flex;
      gap: 8px;
    }

    .btn {
      font-family: 'Plus Jakarta Sans', 'Inter', sans-serif;
      font-weight: 600;
      font-size: 14px;
      min-height: 46px;
      border-radius: 10px;
      padding: 0 16px;
      border: 1px solid transparent;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-decoration: none;
      transition: opacity 0.15s, background 0.15s;
    }
    .btn:disabled { opacity: 0.55; cursor: not-allowed; }
    .btn-primary { background: var(--brand); color: #fff; flex: 1; }
    .btn-primary:hover:not(:disabled) { background: var(--brand-dark); }
    .btn-approve { background: var(--success); color: #fff; flex: 1.3; }
    .btn-approve:hover:not(:disabled) { background: #059669; }
    .btn-danger-outline {
      background: var(--danger-soft);
      color: var(--danger);
      border-color: var(--danger-border);
      flex: 1;
    }
    .btn-whatsapp {
      background: #16A34A;
      color: #fff;
      width: 100%;
      min-height: 50px;
      font-size: 15px;
    }
    .btn-whatsapp:hover { background: #15803D; }

    .toast {
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 13px;
      font-weight: 500;
    }
    .toast-success { background: var(--success-soft); color: var(--success-dark); border: 1px solid var(--success-border); }
    .toast-error { background: var(--danger-soft); color: var(--danger-dark); border: 1px solid var(--danger-border); }

    .footer {
      text-align: center;
      margin-top: 4px;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .footer-clock {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      color: var(--text-secondary);
    }
    .footer-note {
      font-size: 11px;
      color: var(--text-muted);
    }

    .center-box {
      text-align: center;
      padding: 56px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid var(--border-subtle);
      border-top-color: var(--brand);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Modal / Lightbox */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 50;
      background: rgba(15, 23, 42, 0.72);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
    }
    .modal-backdrop.open { display: flex; }
    .confirm-card {
      background: #fff;
      border-radius: 14px;
      max-width: 400px;
      width: 100%;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .confirm-title {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-weight: 700;
      font-size: 17px;
    }
    .confirm-text {
      font-size: 13.5px;
      color: var(--text-secondary);
      line-height: 1.5;
    }
    .lightbox-img {
      max-width: 100%;
      max-height: 82vh;
      border-radius: 10px;
      object-fit: contain;
    }
    .lightbox-close {
      position: fixed;
      top: 16px;
      right: 16px;
      width: 42px;
      height: 42px;
      border-radius: 9999px;
      border: none;
      background: rgba(255,255,255,0.2);
      color: #fff;
      font-size: 20px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <div class="brand-icon" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
          </svg>
        </div>
        <div style="min-width:0">
          <div id="shopName" class="shop-name">BenchOS</div>
          <div class="shop-sub">Acompanhamento de reparo</div>
        </div>
      </div>
      <div id="osPill" class="os-pill" style="display:none">OS #—</div>
    </div>
  </header>

  <main id="app" class="container">
    <div class="center-box">
      <div class="spinner"></div>
      <p style="font-size:13px;color:var(--text-secondary)">Consultando sua ordem de serviço...</p>
    </div>
  </main>

  <!-- Confirmation Modal -->
  <div id="confirmModal" class="modal-backdrop" role="dialog" aria-modal="true">
    <div class="confirm-card">
      <div id="confirmTitle" class="confirm-title"></div>
      <p id="confirmBody" class="confirm-text"></p>
      <div class="decision-actions" style="margin-top:4px">
        <button id="confirmCancel" class="btn" style="background:var(--bg-subtle);color:var(--text-primary);flex:1">Voltar</button>
        <button id="confirmSubmit" class="btn btn-approve">Confirmar</button>
      </div>
    </div>
  </div>

  <!-- Photo Zoom Lightbox -->
  <div id="lightbox" class="modal-backdrop">
    <button id="lightboxClose" class="lightbox-close" aria-label="Fechar">✕</button>
    <img id="lightboxImg" class="lightbox-img" alt="Foto do aparelho" />
  </div>

  <script>
    (function () {
      const pathParts = window.location.pathname.split('/').filter(Boolean);
      const token = pathParts[pathParts.length - 1] || '';

      const STATUS_LABELS = {
        RECEIVED: ['Recebido', 'st-neutral'],
        DIAGNOSING: ['Em Diagnóstico', 'st-info'],
        QUOTE_SENT: ['Aguardando Aprovação', 'st-warning'],
        APPROVED: ['Aprovado', 'st-info'],
        WAITING_PARTS: ['Aguardando Peça', 'st-warning'],
        IN_REPAIR: ['Em Conserto', 'st-info'],
        READY_FOR_PICKUP: ['Pronto p/ Retirada', 'st-success'],
        DELIVERED: ['Entregue', 'st-neutral'],
        REJECTED: ['Orçamento Recusado', 'st-danger'],
        DISCARDED: ['Descartado', 'st-neutral'],
        CANCELLED: ['Cancelado', 'st-danger'],
      };

      const PHOTO_STAGES = {
        INTAKE: 'Entrada',
        DIAGNOSIS: 'Diagnóstico',
        COMPLETED: 'Concluído',
      };

      let currentOrder = null;
      let feedbackMessage = null;
      let pendingAction = null;
      let isSubmitting = false;

      function escapeHtml(str) {
        return String(str ?? '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function formatMoney(val) {
        const num = Number(val) || 0;
        return 'R$ ' + num.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      }

      function formatShortDate(iso) {
        if (!iso) return '';
        const parts = String(iso).slice(0, 10).split('-');
        return parts.length === 3 ? parts[2] + '/' + parts[1] : iso;
      }

      function formatClock() {
        const d = new Date();
        return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
      }

      function formatWaPhone(phone) {
        const digits = String(phone || '').replace(/\D/g, '');
        if (!digits) return '';
        return (digits.length === 10 || digits.length === 11) && !digits.startsWith('55')
          ? '55' + digits
          : digits;
      }

      function getStepMeta(status) {
        switch (status) {
          case 'RECEIVED':
            return { idx: 0, mode: 'reached', third: 'Aprovado', helper: 'Etapa 1 de 5: aparelho recebido e na fila de avaliação.' };
          case 'DIAGNOSING':
            return { idx: 1, mode: 'reached', third: 'Aprovado', helper: 'Etapa 2 de 5: técnico realizando diagnóstico na bancada.' };
          case 'QUOTE_SENT':
            return { idx: 2, mode: 'warn', third: 'Orçamento', helper: 'Etapa 3 de 5: orçamento pronto! Aguardando sua aprovação abaixo.' };
          case 'APPROVED':
            return { idx: 2, mode: 'reached', third: 'Aprovado', helper: 'Etapa 3 de 5: orçamento aprovado! Preparando início do reparo.' };
          case 'WAITING_PARTS':
            return { idx: 2, mode: 'warn', third: 'Peça', helper: 'Etapa 3 de 5: aguardando chegada de peça de reposição.' };
          case 'IN_REPAIR':
            return { idx: 3, mode: 'reached', third: 'Aprovado', helper: 'Etapa 4 de 5: equipamento em conserto e testes na bancada.' };
          case 'READY_FOR_PICKUP':
            return { idx: 4, mode: 'reached', third: 'Aprovado', helper: 'Equipamento finalizado, testado e pronto para retirada no balcão.' };
          case 'DELIVERED':
            return { idx: 4, mode: 'reached', third: 'Aprovado', helper: 'Aparelho entregue com sucesso.' };
          case 'REJECTED':
            return { idx: 2, mode: 'danger', third: 'Recusado', helper: 'Orçamento recusado — aparelho disponível para retirada sem custo.' };
          case 'DISCARDED':
            return { idx: 4, mode: 'danger', third: 'Encerrado', helper: 'Atendimento encerrado por descarte após prazo de abandono.' };
          default:
            return { idx: 0, mode: 'danger', third: 'Cancelado', helper: 'Atendimento cancelado.' };
        }
      }

      function renderOrder(order) {
        currentOrder = order;
        document.getElementById('shopName').textContent = order.shopName || 'BenchOS';
        document.title = 'OS #' + order.orderNumber + ' · ' + (order.shopName || 'BenchOS');
        const osPill = document.getElementById('osPill');
        osPill.textContent = 'OS #' + order.orderNumber;
        osPill.style.display = 'inline-block';

        const app = document.getElementById('app');
        const itemsHtml = (order.items || []).map(function (item) {
          const st = STATUS_LABELS[item.status] || [item.status, 'st-neutral'];
          const step = getStepMeta(item.status);
          const labels = ['Recebido', 'Diagnóstico', step.third, 'Conserto', 'Pronto'];
          const applianceName = [item.applianceType, item.brand, item.model].filter(Boolean).join(' ');

          const labelsHtml = labels.map(function (lbl, i) {
            let cls = '';
            if (i < step.idx) cls = 'reached';
            else if (i === step.idx) cls = step.mode;
            return '<span class="' + cls + '">' + escapeHtml(lbl) + '</span>';
          }).join('');

          const barsHtml = labels.map(function (_, i) {
            let cls = 'step-bar';
            if (i < step.idx) cls += ' reached';
            else if (i === step.idx) cls += ' ' + step.mode;
            return '<div class="' + cls + '"></div>';
          }).join('');

          const diagHtml = item.technicalDiagnosis
            ? '<div class="diag-box ' + (item.status === 'WAITING_PARTS' ? 'warn' : '') + '">' +
                '<div class="overline">' + (item.status === 'WAITING_PARTS' ? 'STATUS DE PEÇA / DIAGNÓSTICO' : 'DIAGNÓSTICO TÉCNICO') + '</div>' +
                '<div class="diag-body">' + escapeHtml(item.technicalDiagnosis) + '</div>' +
              '</div>'
            : '';

          const photosHtml = item.photos && item.photos.length > 0
            ? '<div>' +
                '<div class="row-between">' +
                  '<div class="overline" style="margin:0">FOTOS DO ATENDIMENTO (' + item.photos.length + ')</div>' +
                  '<div style="font-family:\'JetBrains Mono\',monospace;font-size:10px;color:var(--text-muted)">Toque para ampliar</div>' +
                '</div>' +
                '<div class="photos-grid">' +
                  item.photos.map(function (p) {
                    return '<div class="photo-tile" data-zoom="' + escapeHtml(p.viewUrl) + '">' +
                      '<img src="' + escapeHtml(p.viewUrl) + '" alt="Foto ' + escapeHtml(PHOTO_STAGES[p.stage] || p.stage) + '" loading="lazy" />' +
                      '<span class="photo-stage">' + escapeHtml(PHOTO_STAGES[p.stage] || p.stage) + '</span>' +
                    '</div>';
                  }).join('') +
                '</div>' +
              '</div>'
            : '';

          const priceValue = Number(item.totalPrice) || 0;
          const decisionHtml = item.status === 'QUOTE_SENT'
            ? '<div class="decision-box">' +
                '<div class="decision-title">Aprovação de Orçamento</div>' +
                '<div class="decision-sub">Você aprova o conserto deste aparelho' + (priceValue > 0 ? ' no valor de <strong>' + formatMoney(priceValue) + '</strong>' : '') + '?</div>' +
                '<div class="decision-actions">' +
                  '<button class="btn btn-danger-outline" data-action="reject" data-index="' + item.itemIndex + '" data-name="' + escapeHtml(applianceName) + '" data-price="' + priceValue + '">Recusar</button>' +
                  '<button class="btn btn-approve" data-action="approve" data-index="' + item.itemIndex + '" data-name="' + escapeHtml(applianceName) + '" data-price="' + priceValue + '">Aprovar conserto</button>' +
                '</div>' +
              '</div>'
            : '';

          let footerHtml = '';
          if (priceValue > 0) {
            footerHtml =
              '<div class="price-footer">' +
                '<div>' +
                  '<div class="price-label">Valor do conserto</div>' +
                  '<div class="price-value">' + formatMoney(priceValue) + '</div>' +
                '</div>' +
                (item.warrantyDays > 0
                  ? '<div class="warranty-pill">Garantia: ' + item.warrantyDays + ' dias</div>'
                  : '') +
              '</div>';
          } else if (item.estimatedCompletionDate) {
            footerHtml =
              '<div class="price-footer">' +
                '<div class="price-label">Previsão de conclusão: <strong style="font-family:\'JetBrains Mono\',monospace;color:var(--text-primary)">' + formatShortDate(item.estimatedCompletionDate) + '</strong></div>' +
              '</div>';
          }

          return (
            '<section class="card">' +
              '<div class="row-between">' +
                '<span class="tag-pill">#' + escapeHtml(item.tag) + '</span>' +
                '<span class="status-badge ' + st[1] + '"><span class="status-dot"></span>' + escapeHtml(st[0]) + '</span>' +
              '</div>' +
              '<div>' +
                '<h2 class="appliance-title">' + escapeHtml(applianceName) + '</h2>' +
                '<div class="entry-sub">Entrada registrada em ' + formatShortDate(order.createdAt) +
                  (item.estimatedCompletionDate ? ' · Previsão: ' + formatShortDate(item.estimatedCompletionDate) : '') +
                '</div>' +
              '</div>' +
              '<div class="stepper">' +
                '<div class="step-labels">' + labelsHtml + '</div>' +
                '<div class="step-bars">' + barsHtml + '</div>' +
                '<div class="helper-line">' + escapeHtml(step.helper) + '</div>' +
              '</div>' +
              diagHtml +
              decisionHtml +
              photosHtml +
              footerHtml +
            '</section>'
          );
        }).join('');

        const hasDelivered = (order.items || []).some(function (i) { return i.status === 'DELIVERED'; });
        const receiptBtnHtml = hasDelivered
          ? '<a class="btn btn-primary" style="width:100%;min-height:48px" href="/track/' + encodeURIComponent(token) + '/receipt">Ver Comprovante e Termo de Garantia</a>'
          : '';

        const waDigits = formatWaPhone(order.shopPhone);
        const waText = encodeURIComponent('Olá! Gostaria de falar sobre a OS #' + order.orderNumber + '.');
        const waBtnHtml = waDigits
          ? '<a class="btn btn-whatsapp" href="https://wa.me/' + waDigits + '?text=' + waText + '" target="_blank" rel="noopener">Falar com a Oficina no WhatsApp</a>'
          : '';

        const toastHtml = feedbackMessage
          ? '<div class="toast ' + (feedbackMessage.type === 'success' ? 'toast-success' : 'toast-error') + '">' + escapeHtml(feedbackMessage.text) + '</div>'
          : '';

        app.innerHTML =
          toastHtml +
          '<div class="banner">' +
            '<div class="banner-icon" aria-hidden="true">' +
              '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/></svg>' +
            '</div>' +
            '<div>' +
              '<div class="banner-title">Página oficial de acompanhamento</div>' +
              '<div class="banner-text">Acompanhe aqui o andamento dos seus aparelhos em tempo real com transparência e segurança técnica.</div>' +
            '</div>' +
          '</div>' +
          itemsHtml +
          receiptBtnHtml +
          '<section class="card" style="gap:6px">' +
            '<div style="font-weight:600;font-size:14px">Instruções de Retirada</div>' +
            '<p style="font-size:13px;color:var(--text-secondary);line-height:1.5">Quando o status estiver como <strong>Pronto p/ Retirada</strong>, apresente o número da ordem <strong style="font-family:\'JetBrains Mono\',monospace">#' + order.orderNumber + '</strong> no balcão da oficina <strong>' + escapeHtml(order.shopName) + '</strong>.</p>' +
          '</section>' +
          waBtnHtml +
          '<footer class="footer">' +
            '<div class="footer-clock">BenchOS · Atualizado às ' + formatClock() + '</div>' +
            '<div class="footer-note">Ambiente seguro para cliente final · OS #' + order.orderNumber + '</div>' +
          '</footer>';

        bindEvents();
      }

      function bindEvents() {
        document.querySelectorAll('[data-zoom]').forEach(function (el) {
          el.addEventListener('click', function () {
            document.getElementById('lightboxImg').src = el.getAttribute('data-zoom');
            document.getElementById('lightbox').classList.add('open');
          });
        });

        document.querySelectorAll('[data-action]').forEach(function (btn) {
          btn.addEventListener('click', function () {
            if (isSubmitting) return;
            const action = btn.getAttribute('data-action');
            const itemIndex = Number(btn.getAttribute('data-index'));
            const name = btn.getAttribute('data-name') || 'aparelho';
            const price = Number(btn.getAttribute('data-price')) || 0;

            pendingAction = { action: action, itemIndex: itemIndex };

            const titleEl = document.getElementById('confirmTitle');
            const bodyEl = document.getElementById('confirmBody');
            const submitBtn = document.getElementById('confirmSubmit');

            if (action === 'approve') {
              titleEl.textContent = 'Confirmar aprovação?';
              bodyEl.textContent = 'Ao aprovar, a oficina já iniciará o conserto do ' + name + (price > 0 ? ' pelo valor de ' + formatMoney(price) : '') + '.';
              submitBtn.textContent = 'Sim, aprovar conserto';
              submitBtn.className = 'btn btn-approve';
            } else {
              titleEl.textContent = 'Recusar orçamento?';
              bodyEl.textContent = 'O conserto do ' + name + ' não será realizado e o aparelho ficará disponível para devolução sem custo.';
              submitBtn.textContent = 'Sim, recusar';
              submitBtn.className = 'btn btn-danger-outline';
            }

            document.getElementById('confirmModal').classList.add('open');
          });
        });
      }

      async function loadOrder() {
        if (!token) {
          renderError('Link inválido.');
          return;
        }
        try {
          const res = await fetch('/api/v1/public/orders/' + encodeURIComponent(token));
          if (!res.ok) {
            renderError('Ordem de serviço não encontrada ou link expirado.');
            return;
          }
          const data = await res.json();
          renderOrder(data);
        } catch (err) {
          renderError('Não foi possível conectar à oficina. Tente atualizar a página.');
        }
      }

      function renderError(msg) {
        document.getElementById('app').innerHTML =
          '<div class="center-box">' +
            '<h2 style="font-family:\'Plus Jakarta Sans\',sans-serif;font-size:18px">Ordem não encontrada</h2>' +
            '<p style="font-size:13px;color:var(--text-secondary);max-width:300px">' + escapeHtml(msg) + '</p>' +
          '</div>';
      }

      document.getElementById('lightboxClose').addEventListener('click', function () {
        document.getElementById('lightbox').classList.remove('open');
      });
      document.getElementById('lightbox').addEventListener('click', function (e) {
        if (e.target === e.currentTarget) e.currentTarget.classList.remove('open');
      });

      document.getElementById('confirmCancel').addEventListener('click', function () {
        if (isSubmitting) return;
        document.getElementById('confirmModal').classList.remove('open');
        pendingAction = null;
      });

      document.getElementById('confirmSubmit').addEventListener('click', async function () {
        if (!pendingAction || isSubmitting) return;
        isSubmitting = true;
        const activeAction = pendingAction;
        const submitBtn = document.getElementById('confirmSubmit');
        const cancelBtn = document.getElementById('confirmCancel');
        const originalSubmitLabel = submitBtn.textContent;
        submitBtn.disabled = true;
        cancelBtn.disabled = true;
        submitBtn.textContent = 'Enviando...';
        document.querySelectorAll('[data-action]').forEach(function (btn) {
          btn.disabled = true;
        });

        try {
          const endpoint = '/api/v1/public/orders/' + encodeURIComponent(token) +
            '/items/' + activeAction.itemIndex + '/' + activeAction.action;
          const res = await fetch(endpoint, { method: 'POST' });
          if (!res.ok) {
            let errText = res.status === 409 || res.status === 422
              ? 'Este orçamento já foi atualizado. Exibindo o status mais recente.'
              : 'Não foi possível registrar sua resposta. Atualize a página.';
            if (res.status !== 409 && res.status !== 422) {
              try {
                const prob = await res.json();
                if (prob && prob.detail) errText = prob.detail;
              } catch (_) {}
            }
            feedbackMessage = { type: 'error', text: errText };
            document.getElementById('confirmModal').classList.remove('open');
            pendingAction = null;
            await loadOrder();
            return;
          }
          const updated = await res.json();
          feedbackMessage = {
            type: 'success',
            text: activeAction.action === 'approve'
              ? 'Orçamento aprovado com sucesso! A oficina já foi notificada para iniciar o reparo.'
              : 'Orçamento recusado. O aparelho ficará disponível para devolução sem custo.'
          };
          document.getElementById('confirmModal').classList.remove('open');
          pendingAction = null;
          renderOrder(updated);
          window.scrollTo({ top: 0, behavior: 'smooth' });
        } catch (err) {
          feedbackMessage = { type: 'error', text: 'Erro de conexão. Tente novamente.' };
          document.getElementById('confirmModal').classList.remove('open');
          if (currentOrder) renderOrder(currentOrder);
        } finally {
          isSubmitting = false;
          submitBtn.disabled = false;
          cancelBtn.disabled = false;
          submitBtn.textContent = originalSubmitLabel;
          document.querySelectorAll('[data-action]').forEach(function (btn) {
            btn.disabled = false;
          });
        }
      });

      loadOrder();
    })();
  </script>
</body>
</html>
